# Local development only: Compose reads this file on its own beside docker-compose.yml (Azure does not use Compose).
# The app and the worker run the code in this folder instead of the copy baked into the image. The app restarts when a
# Python file changes (UVICORN_RELOAD, handled by docker-entrypoint.sh, so RUN_MIGRATIONS still applies). Templates and
# static files are read from disk on each request, so they need no restart. The worker does not reload: run
# `docker compose restart worker` after changing job code. A new dependency still needs --build.
services:
  app:
    environment:
      UVICORN_RELOAD: "true"
    volumes:
      - ./app:/srv/app
      - ./migrations:/srv/migrations
  worker:
    volumes:
      - ./app:/srv/app
      - ./migrations:/srv/migrations
