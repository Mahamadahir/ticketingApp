<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Break-glass sign-in</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  {% include "_outage_banner.html" %}
  <main class="login-page">
    <h1>Break-glass sign-in</h1>
    <p class="note">
      For emergencies only (for example when Microsoft sign-in is down). Every use is recorded and the
      super admins are told. The details are in IT Glue.
    </p>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" action="/auth/break-glass" autocomplete="off">
      <label>
        Username
        <input type="text" name="username" required autocapitalize="none" spellcheck="false" />
      </label>
      <label>
        Password
        <input type="password" name="password" required />
      </label>
      <label>
        Authenticator code
        <input type="text" name="code" required inputmode="numeric" autocomplete="one-time-code" maxlength="10" />
      </label>
      <button type="submit">Sign in</button>
    </form>
    <p><a href="/auth/login">Back to the normal sign-in</a></p>
  </main>
</body>
</html>
