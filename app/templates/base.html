<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}IT Support Ticketing{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <header>
    <h1><a href="/">IT Support Ticketing</a></h1>
    <nav>
      {% if user %}
        {% if user.role.value in ("super_admin", "agent") %}
        <a href="/tickets">Tickets</a>
        {% endif %}
        <a href="/portal">My requests</a>
        {% if user.role.value == "super_admin" %}
        <a href="/admin/users">Admin</a>
        {% endif %}
        <span class="user-chip">{{ user.display_name }} &middot; {{ user.role.value }}</span>
        <form method="post" action="/auth/logout" class="inline-form"><button type="submit">Sign out</button></form>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
