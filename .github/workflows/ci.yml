name: CI

on:
  # Not on pushes to main: the pull request's run already tested the same code, and a merge
  # to main only happens through a pull request. A release tag still gets its own run.
  push:
    tags: ["v*"]
  # Documentation alone cannot break the tests. Do not make this check required in branch
  # protection: a skipped run would leave a docs-only pull request waiting forever.
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "*.md"

permissions:
  contents: read

# A new push to a pull request cancels that pull request's run still in progress: only the
# latest commit's result matters. Tag runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Pinned until a run on Ubuntu 26 (the new ubuntu-latest) has been checked.
    runs-on: ubuntu-24.04
    # A full run takes a few minutes; without this a hung test holds the runner for GitHub's
    # six-hour default.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticketing
          POSTGRES_PASSWORD: ticketing
          POSTGRES_DB: ticketing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The tests create and wipe ticketing_test; the migration check below
      # uses the separate ticketing database.
      TEST_DATABASE_URL: postgresql+psycopg2://ticketing:ticketing@localhost:5432/ticketing_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      # -n auto: one pytest-xdist worker per core, each with its own database
      # (ticketing_gw0_test, ...; see per_worker in tests/conftest.py).
      - name: Run tests (against Postgres)
        run: pytest -n auto

      - name: Check migrations match the models
        env:
          ENV: dev
          DATABASE_URL: postgresql+psycopg2://ticketing:ticketing@localhost:5432/ticketing
        run: |
          alembic upgrade head
          alembic check
