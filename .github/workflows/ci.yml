name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Documentation alone cannot break the tests. Path filters are not applied to tag
    # pushes, so a release tag always runs. Do not make this check required in branch
    # protection: a skipped run would leave a docs-only pull request waiting forever.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "*.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticketing
          POSTGRES_PASSWORD: ticketing
          POSTGRES_DB: ticketing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The tests create and wipe ticketing_test; the migration check below
      # uses the separate ticketing database.
      TEST_DATABASE_URL: postgresql+psycopg2://ticketing:ticketing@localhost:5432/ticketing_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests (against Postgres)
        run: pytest

      - name: Check migrations match the models
        env:
          ENV: dev
          DATABASE_URL: postgresql+psycopg2://ticketing:ticketing@localhost:5432/ticketing
        run: |
          alembic upgrade head
          alembic check
