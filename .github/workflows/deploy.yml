name: Deploy

# DRAFT: written but never run. It cannot be proved without an Azure subscription,
# so the first run on staging is also its test (see "Staging checklist" in
# docs/build-plan.md). Setup it needs is in infra/README.md.
#
# Nothing here is hard-coded: Azure IDs, the resource group and every setting
# come from the GitHub Environment (variables and secrets); the registry and
# app names are found in the resource group. No secret is stored for Azure
# itself: login is OIDC.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy this commit"
        type: choice
        default: staging
        options:
          - staging
          - staging-then-production
  # To deploy every push to main to staging (never production), remove the
  # leading '#' from the next three lines.
  # push:
  #   branches: [main]
  #   paths-ignore: ["docs/**", "**/*.md", "*.md"]

permissions:
  contents: read

# One deploy at a time, for all environments. A running deploy is never
# cancelled mid-migration, but GitHub keeps only one waiting run: dispatching a
# third cancels the second while it still waits.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ticketing

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Built once and pushed to each environment's registry, so what reaches
      # production is the image that was deployed to staging.
      - name: Build image
        run: docker build --tag "$IMAGE_NAME:$GITHUB_SHA" .

      - name: Save image
        run: docker save "$IMAGE_NAME:$GITHUB_SHA" --output image.tar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
          retention-days: 1
          compression-level: 6

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    # Staging first, then production only if staging succeeded (fail-fast stops
    # the second leg). Production waits for the required reviewers set on the
    # `production` GitHub Environment.
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        environment: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.target == 'staging-then-production' && '["staging","production"]' || '["staging"]') }}
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write # OIDC token for azure/login
      contents: read
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      BICEP_PARAMS: infra/${{ matrix.environment }}.bicepparam
      # Non-secret settings infra/<environment>.bicepparam reads with
      # readEnvironmentVariable. The secrets are set only on the two steps that
      # run az deployment, not on every step.
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      WEB_ALLOWED_CIDRS: ${{ vars.WEB_ALLOWED_CIDRS }}
      SSO_TENANT_ID: ${{ vars.SSO_TENANT_ID }}
      SSO_CLIENT_ID: ${{ vars.SSO_CLIENT_ID }}
      GRAPH_TENANT_ID: ${{ vars.GRAPH_TENANT_ID }}
      GRAPH_CLIENT_ID: ${{ vars.GRAPH_CLIENT_ID }}
      GRAPH_SHARED_MAILBOX: ${{ vars.GRAPH_SHARED_MAILBOX }}
      SUPER_ADMIN_EMAILS: ${{ vars.SUPER_ADMIN_EMAILS }}
      TEAMS_NEW_TICKET_ENABLED: ${{ vars.TEAMS_NEW_TICKET_ENABLED }}
      TEAMS_NOTIFICATIONS_ENABLED: ${{ vars.TEAMS_NOTIFICATIONS_ENABLED }}
      TEAMS_BOT_ENABLED: ${{ vars.TEAMS_BOT_ENABLED }}
      TEAMS_BOT_IDENTITY: ${{ vars.TEAMS_BOT_IDENTITY }}
      TEAMS_BOT_APP_ID: ${{ vars.TEAMS_BOT_APP_ID }}
      TEAMS_BOT_TENANT_ID: ${{ vars.TEAMS_BOT_TENANT_ID }}
      PRESENCE_ENABLED: ${{ vars.PRESENCE_ENABLED }}
      MAILBOX_TIME_ZONES_ENABLED: ${{ vars.MAILBOX_TIME_ZONES_ENABLED }}
      ENTRA_ACCOUNT_CHECK_ENABLED: ${{ vars.ENTRA_ACCOUNT_CHECK_ENABLED }}
      ATTACHMENTS_COOL_AFTER_DAYS: ${{ vars.ATTACHMENTS_COOL_AFTER_DAYS }} # staging only; production fixes 365
      DEPLOY_PUBLIC_APP: ${{ vars.DEPLOY_PUBLIC_APP }}
      DEPLOY_WORKER: ${{ vars.DEPLOY_WORKER }}
      MAIL_SENDING: ${{ vars.MAIL_SENDING }}
      GRAPH_SUBSCRIPTION_ENABLED: ${{ vars.GRAPH_SUBSCRIPTION_ENABLED }}
      MAIL_CATCH_UP_ENABLED: ${{ vars.MAIL_CATCH_UP_ENABLED }}
      INBOUND_ENABLED: ${{ vars.INBOUND_ENABLED }}
      WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
    steps:
      - name: Production deploys only from main
        if: matrix.environment == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deploys only from main (this run is on $GITHUB_REF)." >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - name: Load image
        run: docker load --input image.tar

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Find the registry and push the image
        id: image
        run: |
          set -euo pipefail
          # One registry per resource group, created by infra/main.bicep.
          registry="$(az acr list --resource-group "$RESOURCE_GROUP" --query '[0].name' --output tsv)"
          if [ -z "$registry" ]; then
            echo "::error::No container registry in $RESOURCE_GROUP. Deploy the platform first (infra/README.md)." >&2
            exit 1
          fi
          server="$(az acr show --name "$registry" --query loginServer --output tsv)"
          image="$server/$IMAGE_NAME:$GITHUB_SHA"
          az acr login --name "$registry"
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$image"
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # The same variables the README tells you to set in your shell:
      # infra/<environment>.bicepparam reads them with readEnvironmentVariable.
      # Every secret must be supplied on every deploy or the new revision
      # silently loses it (infra/README.md, "Things that bite on redeploys").
      # A switch that is on without what it needs deploys cleanly and then does
      # nothing (or queues Teams posts nobody sends), so refuse it here.
      - name: Check the Teams, presence and mail settings
        env:
          ENVIRONMENT_NAME: ${{ matrix.environment }}
          TEAMS_NEW_TICKET_WEBHOOK_URL: ${{ secrets.TEAMS_NEW_TICKET_WEBHOOK_URL }}
          TEAMS_BOT_CLIENT_SECRET: ${{ secrets.TEAMS_BOT_CLIENT_SECRET }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          fail=0
          # Read the way the param files read them: any case, spaces around are ignored.
          for name in TEAMS_NEW_TICKET_ENABLED TEAMS_NOTIFICATIONS_ENABLED TEAMS_BOT_ENABLED PRESENCE_ENABLED MAILBOX_TIME_ZONES_ENABLED ENTRA_ACCOUNT_CHECK_ENABLED GRAPH_SUBSCRIPTION_ENABLED MAIL_CATCH_UP_ENABLED INBOUND_ENABLED DEPLOY_PUBLIC_APP DEPLOY_WORKER MAIL_SENDING; do
            value="$(printf '%s' "${!name:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
            case "$name:$value" in
              MAIL_SENDING:"" | MAIL_SENDING:off | MAIL_SENDING:graph) printf -v "$name" '%s' "$value" ;;
              MAIL_SENDING:*) echo "::error::MAIL_SENDING must be off or graph, not '${!name}'." >&2; fail=1 ;;
              *:"" | *:true | *:false) printf -v "$name" '%s' "$value" ;;
              *) echo "::error::$name must be true or false, not '${!name}'." >&2; fail=1 ;;
            esac
          done
          # What the param files default to when the variable is empty: staging runs both, production neither.
          default=false
          if [ "$ENVIRONMENT_NAME" = staging ]; then default=true; fi
          worker_on="${DEPLOY_WORKER:-$default}"
          public_on="${DEPLOY_PUBLIC_APP:-$default}"
          if { [ "${MAIL_SENDING:-}" = graph ] || [ "${GRAPH_SUBSCRIPTION_ENABLED:-}" = true ]; } && [ "$public_on" != true ]; then
            echo "::warning::Mail sending or the Graph subscription is on but the public app is not deployed (DEPLOY_PUBLIC_APP): approval links and Graph notifications have nowhere to go."
          fi
          if { [ "${TEAMS_NEW_TICKET_ENABLED:-}" = true ] || [ "${TEAMS_NOTIFICATIONS_ENABLED:-}" = true ] || [ "${PRESENCE_ENABLED:-}" = true ] || [ "${MAILBOX_TIME_ZONES_ENABLED:-}" = true ] || [ "${ENTRA_ACCOUNT_CHECK_ENABLED:-}" = true ] || [ "${MAIL_SENDING:-}" = graph ] || [ "${GRAPH_SUBSCRIPTION_ENABLED:-}" = true ] || [ "${MAIL_CATCH_UP_ENABLED:-}" = true ] || [ "${INBOUND_ENABLED:-}" = true ]; } && [ "$worker_on" != true ]; then
            echo "::warning::A Teams, presence, Entra account check, mailbox time zone or mail switch is on but the worker is not deployed (DEPLOY_WORKER), and the worker does the sending and the presence checks. Posts and emails will queue and nothing will send them."
          fi
          if [ "${TEAMS_NEW_TICKET_ENABLED:-}" = true ] || [ "${TEAMS_NOTIFICATIONS_ENABLED:-}" = true ]; then
            if [ -z "$TEAMS_NEW_TICKET_WEBHOOK_URL" ]; then
              echo "::error::Teams posts are on but the TEAMS_NEW_TICKET_WEBHOOK_URL secret is empty." >&2
              fail=1
            fi
          fi
          if [ "${TEAMS_BOT_ENABLED:-}" = true ]; then
            if [ "$public_on" != true ]; then
              echo "::error::The Teams bot is on but the public app is not deployed (DEPLOY_PUBLIC_APP): its endpoint lives there." >&2
              fail=1
            fi
            identity="$(printf '%s' "${TEAMS_BOT_IDENTITY:-managedIdentity}" | tr -d '[:space:]')"
            case "$identity" in
              managedIdentity | "") ;;
              clientSecret)
                if [ -z "${TEAMS_BOT_APP_ID:-}" ] || [ -z "$TEAMS_BOT_CLIENT_SECRET" ]; then
                  echo "::error::TEAMS_BOT_IDENTITY=clientSecret needs the TEAMS_BOT_APP_ID variable and the TEAMS_BOT_CLIENT_SECRET secret." >&2
                  fail=1
                fi ;;
              *) echo "::error::TEAMS_BOT_IDENTITY must be managedIdentity or clientSecret, not '$identity'." >&2; fail=1 ;;
            esac
            if [ "$worker_on" != true ]; then
              echo "::warning::The Teams bot is on but the worker is not deployed (DEPLOY_WORKER): the endpoint works, but nothing will send messages to people yet."
            fi
          fi
          if [ "${PRESENCE_ENABLED:-}" = true ] || [ "${MAILBOX_TIME_ZONES_ENABLED:-}" = true ] || [ "${ENTRA_ACCOUNT_CHECK_ENABLED:-}" = true ] || [ "${MAIL_SENDING:-}" = graph ] || [ "${GRAPH_SUBSCRIPTION_ENABLED:-}" = true ] || [ "${MAIL_CATCH_UP_ENABLED:-}" = true ] || [ "${INBOUND_ENABLED:-}" = true ]; then
            if [ -z "$GRAPH_TENANT_ID" ] || [ -z "$GRAPH_CLIENT_ID" ] || [ -z "$GRAPH_CLIENT_SECRET" ]; then
              echo "::error::Presence, the Entra account check, mailbox time zones (which also need MailboxSettings.Read), mail sending and the inbound mail switches need GRAPH_TENANT_ID, GRAPH_CLIENT_ID and GRAPH_CLIENT_SECRET." >&2
              fail=1
            fi
          fi
          if [ "${MAIL_SENDING:-}" = graph ] && [ -z "$GRAPH_SHARED_MAILBOX" ]; then
            echo "::error::MAIL_SENDING=graph needs GRAPH_SHARED_MAILBOX (the mailbox mail is sent from)." >&2
            fail=1
          fi
          exit "$fail"

      - name: Preview the deployment
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          # Every secret must be supplied on every deploy or the new revision
          # silently loses it (infra/README.md, "Things that bite on redeploys").
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          SESSION_SECRET_KEY: ${{ secrets.SESSION_SECRET_KEY }}
          INTERNAL_SESSION_SECRET_KEY: ${{ secrets.INTERNAL_SESSION_SECRET_KEY }}
          GRAPH_WEBHOOK_CLIENT_STATE: ${{ secrets.GRAPH_WEBHOOK_CLIENT_STATE }}
          SSO_CLIENT_SECRET: ${{ secrets.SSO_CLIENT_SECRET }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          TEAMS_NEW_TICKET_WEBHOOK_URL: ${{ secrets.TEAMS_NEW_TICKET_WEBHOOK_URL }}
          TEAMS_BOT_CLIENT_SECRET: ${{ secrets.TEAMS_BOT_CLIENT_SECRET }}
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters "$BICEP_PARAMS" \
            --no-pretty-print

      # Migrations run before the apps move to the new image. The job already
      # exists after the first image deploy: point it at the new image, run it,
      # then roll out the apps. On the very first image deploy the job does not
      # exist yet; the template creates it, so it runs after (below).
      - name: Run migrations (existing job)
        id: migrate
        run: |
          set -euo pipefail
          job="$(az containerapp job list --resource-group "$RESOURCE_GROUP" --query "[?contains(name, 'migrate')].name | [0]" --output tsv)"
          if [ -z "$job" ]; then
            echo "No migrate job yet: first image deploy. Migrations run after the template."
            echo "existing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          az containerapp job update --name "$job" --resource-group "$RESOURCE_GROUP" --image "$IMAGE"
          .github/scripts/run-migrate-job.sh "$job" "$RESOURCE_GROUP"
          echo "existing=true" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ steps.image.outputs.image }}

      # Sets IMAGE on web, public and worker (whichever main.bicep deploys) and
      # on the job. A new revision is created for each; in Single revision mode
      # traffic moves only once it is ready.
      - name: Deploy infrastructure and apps
        id: deploy
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          # Every secret must be supplied on every deploy or the new revision
          # silently loses it (infra/README.md, "Things that bite on redeploys").
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          SESSION_SECRET_KEY: ${{ secrets.SESSION_SECRET_KEY }}
          INTERNAL_SESSION_SECRET_KEY: ${{ secrets.INTERNAL_SESSION_SECRET_KEY }}
          GRAPH_WEBHOOK_CLIENT_STATE: ${{ secrets.GRAPH_WEBHOOK_CLIENT_STATE }}
          SSO_CLIENT_SECRET: ${{ secrets.SSO_CLIENT_SECRET }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          TEAMS_NEW_TICKET_WEBHOOK_URL: ${{ secrets.TEAMS_NEW_TICKET_WEBHOOK_URL }}
          TEAMS_BOT_CLIENT_SECRET: ${{ secrets.TEAMS_BOT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          az deployment group create \
            --name "deploy-${GITHUB_SHA::12}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters "$BICEP_PARAMS" \
            --query properties.outputs.migrateJobName.value \
            --output tsv > migrate-job-name.txt
          job="$(cat migrate-job-name.txt)"
          if [ -z "$job" ]; then
            echo "::error::The deployment returned no migrateJobName." >&2
            exit 1
          fi
          echo "job=$job" >> "$GITHUB_OUTPUT"

      - name: Run migrations (first image deploy)
        if: steps.migrate.outputs.existing == 'false'
        run: .github/scripts/run-migrate-job.sh "$JOB" "$RESOURCE_GROUP"
        env:
          JOB: ${{ steps.deploy.outputs.job }}

      - name: Check the rollout and /health
        run: .github/scripts/check-rollout.sh "$RESOURCE_GROUP" "$IMAGE"
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          # Optional. The web app is IP restricted and cannot be reached from a
          # GitHub runner; an open public app is probed automatically.
          HEALTH_URL: ${{ vars.HEALTH_URL }}
