name: Deploy

# Runs after CI passes on a push: main deploys to staging, a v* tag deploys
# to production. Each GitHub Environment holds its own EC2_* secrets.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' ||
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'staging' || 'production' }}
    concurrency:
      group: deploy-${{ github.event.workflow_run.head_branch == 'main' && 'staging' || 'production' }}
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Trust the EC2 host key
        run: ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Check out the tested commit and restart the stack
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "
            set -e
            cd '${{ secrets.EC2_APP_DIR }}'
            git fetch --tags origin
            git checkout --detach '$DEPLOY_SHA'
            docker compose up -d --build
          "
