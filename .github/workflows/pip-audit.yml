name: Dependency audit

# Separate from ci.yml so the `test` check and its triggers stay as they are and
# the audit never adds time to it. Checks the pinned packages (and what they pull
# in) against the Python advisory database.
on:
  pull_request:
    branches: [main]
    paths:
      - "requirements.txt"
      - "requirements-dev.txt"
      - "requirements.lock"
      - "requirements-dev.lock"
      - ".github/workflows/pip-audit.yml"
      - ".github/scripts/compile-lock.sh"
  schedule:
    # Nightly: an advisory can appear against a pin that has not changed.
    # A failure sends the repository's failed-workflow email to whoever last
    # edited the cron line (GitHub's rule for scheduled runs).
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # The dev lock holds everything the app needs plus the test tools, so one run
      # covers both, transitive packages included.
      - name: Audit the lock
        run: |
          pip install pip-audit==2.10.1
          pip-audit --strict --require-hashes -r requirements-dev.lock

  # A Dependabot bump to requirements.txt or requirements-dev.txt does not touch the
  # lock. This fails until the lock is regenerated (docs/build-plan.md, "Dependency
  # lock"), so the lock never drifts from the inputs.
  lock-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Recompile the lock and compare
        run: |
          pip install uv==0.13.4
          bash .github/scripts/compile-lock.sh
          git diff --exit-code -- requirements.lock requirements-dev.lock
